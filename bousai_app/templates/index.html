{% extends "base.html" %}

{% block title %}ホーム | 防災アプリ{% endblock %}

{% block content %}
<style>
  .home-page {
    width: min(710px, 100%);
    margin: 0 auto;
    color: var(--ink);
  }
  .panel {
    padding: 20px;
    border: 1px solid #f0f2f5;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 4px 20px rgb(37 61 94 / 7%);
  }
  .panel + .panel { margin-top: 26px; }
  .panel-heading {
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .panel-heading h1,
  .panel-heading h2 {
    margin: 0;
    color: var(--blue);
    font-size: 18px;
    font-weight: 750;
    line-height: 1.4;
  }
  .hazard-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .hazard-link { color: var(--blue); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .heading-icon {
    position: relative;
    display: inline-block;
    width: 22px;
    height: 22px;
    margin-right: 10px;
    border-radius: 50% 50% 50% 0;
    background: var(--blue);
    color: var(--blue);
    font-size: 0;
    transform: rotate(-45deg);
    vertical-align: 1px;
  }
  .heading-icon::after {
    position: absolute;
    top: 7px;
    left: 7px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    content: "";
  }
  .weather-heading-icon {
    position: relative;
    display: inline-block;
    width: 34px;
    height: 28px;
    margin-right: 7px;
    vertical-align: -4px;
  }
  .weather-sun {
    position: absolute;
    top: -3px;
    left: 1px;
    color: var(--blue);
    font-family: "Segoe UI Symbol", sans-serif;
    font-size: 25px;
    line-height: 1;
  }
  .weather-cloud {
    position: absolute;
    right: 0;
    bottom: 3px;
    width: 25px;
    height: 11px;
    border-radius: 8px;
    background: var(--blue);
  }
  .weather-cloud::before,
  .weather-cloud::after {
    position: absolute;
    border-radius: 50%;
    background: var(--blue);
    content: "";
  }
  .weather-cloud::before {
    top: -7px;
    left: 4px;
    width: 15px;
    height: 15px;
  }
  .weather-cloud::after {
    top: -4px;
    right: 1px;
    width: 12px;
    height: 12px;
  }
  .refresh-label {
    flex: 0 0 auto;
    color: var(--safe);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .refresh-icon { margin-right: 4px; font-size: 17px; }
  .map-frame {
    height: 283px;
    overflow: hidden;
    border-radius: 9px;
    background: #dceaf1;
  }
  #shelterMap { width: 100%; height: 100%; }
  .hazard-marker-shell { border: 0; background: transparent; }
  .hazard-marker {
    display: grid;
    width: 36px;
    height: 36px;
    place-items: center;
    border: 0;
    color: inherit;
    background: transparent;
    filter: drop-shadow(0 1px 2px rgb(255 255 255 / 90%)) drop-shadow(0 1px 2px rgb(35 45 60 / 40%));
    font-size: 29px;
    line-height: 1;
  }
  .leaflet-popup-content {
    width: min(280px, calc(100vw - 88px));
    height: min(430px, 60vh);
    min-height: 0;
    box-sizing: border-box;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  .hazard-popup {
    min-width: 0;
    min-height: 0;
    padding: 8px 0;
    box-sizing: border-box;
    color: #27364b;
  }
  .hazard-popup strong { display: block; margin-bottom: 3px; font-size: 14px; }
  .hazard-popup-category { display: block; margin-bottom: 5px; color: #c54343; font-size: 12px; font-weight: 700; }
  .hazard-popup-address { display: block; margin-bottom: 5px; color: #5d6878; font-size: 11px; }
  .hazard-popup p { margin: 0; color: #5d6878; font-size: 12px; white-space: pre-wrap; }
  .hazard-popup-media { display: grid; gap: 7px; margin-top: 7px; }
  .hazard-popup-media img { display: block; max-width: 190px; max-height: 130px; border-radius: 4px; object-fit: cover; }
  .hazard-popup-media video { display: block; width: min(220px, 70vw); max-height: 150px; }
  .hazard-popup-seen {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid #e7ebf1;
  }
  .hazard-seen-count { color: #6b7789; font-size: 11px; white-space: nowrap; }
  .hazard-seen-button {
    min-height: 30px;
    padding: 3px 9px;
    border: 1px solid #cbd8ea;
    border-radius: 5px;
    color: #315d9e;
    background: #f4f7fc;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .hazard-seen-button:hover:not(:disabled) { border-color: #8ca8d0; background: #eaf1fb; }
  .hazard-seen-button:disabled { color: #758397; background: #f0f2f5; cursor: default; }
  .weather-details {
    padding: 15px 16px;
    border-radius: 9px;
    background: #f5f6f8;
  }
  .weather-area {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    color: #42546b;
    font-size: 16px;
    font-weight: 700;
  }
  .weather-area-icon {
    position: relative;
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
    margin: 0 3px 3px;
    border-radius: 50% 50% 50% 0;
    background: #59697b;
    transform: rotate(-45deg);
  }
  .weather-area-icon::after {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f5f6f8;
    content: "";
  }
  .weather-status {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    margin: 0 0 11px;
    color: var(--safe);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
  }
  .status-icon {
    width: 18px;
    height: 18px;
    display: inline-grid;
    flex: 0 0 18px;
    place-items: center;
    border-radius: 50%;
    background: var(--muted);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
    margin-top: 3px;
  }
  .weather-status[data-state="clear"] .status-icon { background: var(--safe); }
  .weather-status[data-state="warning"],
  .weather-status[data-state="error"] { color: var(--red); }
  .weather-status[data-state="warning"] .status-icon { background: var(--red); }
  .weather-status[data-state="error"],
  .weather-status[data-state="loading"] { color: var(--muted); }
  .weather-times {
    display: grid;
    gap: 5px;
    color: #778497;
    font-size: 13px;
  }
  .weather-time-row { display: flex; align-items: center; gap: 7px; }
  .time-icon {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    color: #647386;
  }
  @media (max-width: 560px) {
    .home-page { width: 100%; }
    .panel { padding: 16px; border-radius: 12px; }
    .panel + .panel { margin-top: 18px; }
    .panel-heading { align-items: flex-start; }
    .panel-heading h1, .panel-heading h2 { font-size: 16px; }
    .refresh-label { font-size: 11px; }
    .map-frame { height: 250px; }
    .weather-details { padding: 13px; }
    .weather-area { font-size: 15px; }
    .weather-status { font-size: 14px; }
    .weather-times { font-size: 12px; }
  }
</style>

<div class="home-page">
  <section class="panel map-panel" aria-labelledby="mapHeading">
    <header class="panel-heading">
      <div><h1 id="mapHeading"><span class="heading-icon" aria-hidden="true"></span>危険箇所マップ</h1><span class="hazard-count" id="hazardCount">登録地点を確認中</span></div>
      <a class="hazard-link" href="/hazard_report">危険箇所を投稿</a>
    </header>
    <div class="map-frame">
      <div id="shelterMap" role="region" aria-label="青森市周辺の地図"></div>
    </div>
  </section>

  <section class="panel weather-panel" aria-labelledby="weatherHeading">
    <header class="panel-heading">
      <h2 id="weatherHeading"><span class="weather-heading-icon" aria-hidden="true"><span class="weather-sun">☀</span><span class="weather-cloud"></span></span><span id="weatherAreaTitle">青森市</span> 気象警報・注意報</h2>
      <span class="refresh-label"><span class="refresh-icon" aria-hidden="true">↻</span>10分おき自動更新</span>
    </header>
    <div class="weather-details" aria-live="polite">
      <div class="weather-area"><span class="weather-area-icon" aria-hidden="true"></span><span id="weatherArea">青森市</span></div>
      <p class="weather-status" id="weatherStatus" data-state="loading">
        <span class="status-icon" id="weatherStatusIcon" aria-hidden="true">◷</span>
        <span id="weatherStatusText">気象情報を取得しています</span>
      </p>
      <div class="weather-times">
        <div class="weather-time-row">
          <svg class="time-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></svg>
          <span>データ取得: <span id="lastFetchTime">確認中</span></span>
        </div>
        <div class="weather-time-row">
          <svg class="time-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m2 11 2.7 2.7 3.1-3.1-2.7-2.7L2 11Z" fill="currentColor"/><path d="m6.2 9.8 5.2-5.2M8.7 2.5a6.1 6.1 0 0 1 4.8 4.8M7.2 5.2a3.4 3.4 0 0 1 2.6 2.6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></svg>
          <span>気象庁発表: <span id="reportTime">確認中</span></span>
        </div>
      </div>
    </div>
  </section>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const mapElement = document.getElementById('shelterMap');
    if (window.L && mapElement) {
        const map = L.map(mapElement).setView([40.8222, 140.7474], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            referrerPolicy: 'strict-origin-when-cross-origin'
        }).addTo(map);

        let fallbackViewerId = '';
        function getViewerId() {
          try {
            let viewerId = localStorage.getItem('hazardSpotViewerId');
            if (!viewerId) {
              viewerId = window.crypto && window.crypto.randomUUID
                ? window.crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
              localStorage.setItem('hazardSpotViewerId', viewerId);
            }
            return viewerId;
          } catch (error) {
            if (!fallbackViewerId) {
              fallbackViewerId = Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
            }
            return fallbackViewerId;
          }
        }

        function hasSeenSpot(spotId) {
          try {
            return localStorage.getItem('hazardSpotSeen:' + spotId) === '1';
          } catch (error) {
            return false;
          }
        }

        const hazardPictograms = {
          '道路の損傷': '🚧',
          '倒木・落下物': '🌳',
          '浸水・冠水': '💧',
          '津波': '🌊',
          '河川氾濫': '🏞',
          '道路冠水': '≋',
          '土砂崩れ': '⛰',
          '積雪による道路寸断': '❄',
          '獣害': '🐾',
          'その他': '⚠'
        };

        fetch('/api/hazard_spots')
          .then(function(response) {
            if (!response.ok) throw new Error('Hazard spots request failed');
            return response.json();
          })
          .then(function(spots) {
            document.getElementById('hazardCount').textContent = '登録地点 ' + spots.length + '件';
            spots.forEach(function(spot) {
              const latitude = Number(spot.latitude);
              const longitude = Number(spot.longitude);
              if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;

              const popup = L.DomUtil.create('div', 'hazard-popup');
              const title = L.DomUtil.create('strong', '', popup);
              const category = L.DomUtil.create('span', 'hazard-popup-category', popup);
                    const address = L.DomUtil.create('span', 'hazard-popup-address', popup);
              const description = L.DomUtil.create('p', '', popup);
              title.textContent = spot.title || '危険箇所';
              category.textContent = spot.category || '';
                    address.textContent = spot.address || '';
              description.textContent = spot.description || '';
                    const media = L.DomUtil.create('div', 'hazard-popup-media', popup);
                    (Array.isArray(spot.attachments) ? spot.attachments : []).forEach(function(attachment) {
                      if (!attachment.url) return;
                      if (attachment.kind === 'image') {
                        const link = document.createElement('a');
                        link.href = attachment.url;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.setAttribute('aria-label', attachment.name || '画像を開く');
                        const image = document.createElement('img');
                        image.src = attachment.url;
                        image.alt = attachment.name || '危険箇所の画像';
                        image.loading = 'lazy';
                        link.append(image);
                        media.append(link);
                      } else if (attachment.kind === 'video') {
                        const video = L.DomUtil.create('video', '', media);
                        video.src = attachment.url;
                        video.controls = true;
                        video.preload = 'metadata';
                      } else {
                        const link = document.createElement('a');
                        link.href = attachment.url;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.textContent = attachment.name || '添付ファイル';
                        media.append(link);
                      }
                    });
              const seenControls = L.DomUtil.create('div', 'hazard-popup-seen', popup);
              const seenCount = L.DomUtil.create('span', 'hazard-seen-count', seenControls);
              const seenButton = L.DomUtil.create('button', 'hazard-seen-button', seenControls);
              seenButton.type = 'button';
              seenButton.textContent = '👀 見ました';
              seenButton.setAttribute('aria-pressed', String(hasSeenSpot(spot.id)));
              seenButton.disabled = hasSeenSpot(spot.id);
              seenCount.textContent = '見た人 ' + (Number(spot.seen_count) || 0) + '人';
              L.DomEvent.disableClickPropagation(seenButton);
              seenButton.addEventListener('click', function() {
                if (seenButton.disabled) return;
                seenButton.disabled = true;
                fetch('/api/hazard_spots/' + encodeURIComponent(spot.id) + '/seen', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ viewer_id: getViewerId() })
                })
                  .then(function(response) {
                    if (!response.ok) throw new Error('Seen update failed');
                    return response.json();
                  })
                  .then(function(result) {
                    seenCount.textContent = '見た人 ' + result.count + '人';
                    seenButton.setAttribute('aria-pressed', 'true');
                    try {
                      localStorage.setItem('hazardSpotSeen:' + spot.id, '1');
                    } catch (error) {
                      // Server-side viewer ID still prevents duplicate counts in this page session.
                    }
                  })
                  .catch(function() {
                    seenButton.disabled = false;
                    seenCount.textContent = '送信できませんでした';
                  });
              });
              const pictogram = Object.prototype.hasOwnProperty.call(hazardPictograms, spot.category)
                ? hazardPictograms[spot.category]
                : hazardPictograms['その他'];
              const markerIcon = L.divIcon({
                className: 'hazard-marker-shell',
                html: '<span class="hazard-marker" aria-hidden="true">' + pictogram + '</span>',
                iconSize: [36, 36],
                iconAnchor: [18, 18]
              });
              L.marker([latitude, longitude], {
                icon: markerIcon,
                title: spot.category || '危険箇所'
              })
                .addTo(map)
                .bindPopup(popup);
            });
          })
          .catch(function() {
            document.getElementById('hazardCount').textContent = '登録地点を取得できません';
          });
    }

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(function(response) {
                if (!response.ok) throw new Error('Weather request failed');
                return response.json();
            })
            .then(updateWeatherContent)
            .catch(function() {
                updateWeatherContent({ error: true });
            });
    }

    function updateWeatherContent(data) {
        const area = data.area_name || '青森市';
        const warnings = Array.isArray(data.warnings) ? data.warnings : [];
        const status = document.getElementById('weatherStatus');
        const statusIcon = document.getElementById('weatherStatusIcon');
        const statusText = document.getElementById('weatherStatusText');

        document.getElementById('weatherAreaTitle').textContent = area;
        document.getElementById('weatherArea').textContent = area;
        document.getElementById('lastFetchTime').textContent = data.last_fetch_time || '確認できません';
        document.getElementById('reportTime').textContent = data.report_time || '不明';

        if (data.error) {
            status.dataset.state = 'error';
            statusIcon.textContent = '!';
            statusText.textContent = '気象情報を取得できません';
        } else if (warnings.length) {
            status.dataset.state = 'warning';
            statusIcon.textContent = '!';
            statusText.textContent = warnings.map(function(warning) {
                return warning.name + (warning.status ? '（' + warning.status + '）' : '');
            }).join('、');
        } else {
            status.dataset.state = 'clear';
            statusIcon.textContent = '✓';
            statusText.textContent = '現在、警報・注意報は発表されていません';
        }
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
