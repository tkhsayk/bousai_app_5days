<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: light;
      --ink: #26364b;
      --muted: #758397;
      --line: #e3e9f0;
      --paper: #f8f9fb;
      --white: #fff;
      --blue: #2d5cab;
      --navy: #2d57a2;
      --blue-pale: #eaf1fb;
      --safe: #25a65a;
      --amber: #cf9140;
      --red: #c94f56;
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
    }
    a { color: inherit; }
    .site-header {
      position: relative;
      z-index: 1000;
      color: #f8fbf8;
      background: var(--navy);
      box-shadow: 0 1px 3px rgb(22 47 91 / 18%);
    }
    .header-inner {
      position: relative;
      width: min(1076px, calc(100% - 40px));
      height: 54px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      color: inherit;
      font-size: 20px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    .global-nav {
      position: absolute;
      top: calc(100% + 7px);
      right: 0;
      width: 220px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--white);
      box-shadow: 0 8px 24px rgb(25 40 68 / 16%);
    }
    .global-nav[hidden] { display: none; }
    .global-nav a {
      display: block;
      padding: 10px 12px;
      border-radius: 4px;
      color: var(--ink);
      font-size: 14px;
      text-decoration: none;
    }
    .global-nav a:hover { background: var(--blue-pale); color: var(--blue); }
    .menu-toggle {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }
    .menu-toggle:hover, .menu-toggle[aria-expanded="true"] { background: rgb(255 255 255 / 14%); }
    .menu-toggle span { font-size: 22px; line-height: 1; }
    .menu-account {
      margin: 5px 10px 7px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0 64px;
    }
    @media (max-width: 780px) {
      .header-inner {
        width: min(100% - 32px, 1076px);
      }
      main {
        width: min(100% - 32px, 1180px);
        padding-top: 20px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span>防災アプリ</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="globalNav">
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="global-nav" id="globalNav" aria-label="メインナビゲーション" hidden>
        <a href="/">ホーム</a>
        <a href="/shelter_search">避難所検索</a>
        <a href="/all_shelters">避難所一覧</a>
        <a href="/hazard_report">危険箇所を投稿</a>
        <a href="/board">指示・発信ボード</a>
        {% if session.logged_in %}
          <div class="menu-account">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</div>
          <a href="/logout">ログアウト</a>
        {% else %}
          <a href="/login">管理者ログイン</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const globalNav = document.getElementById('globalNav');
    menuToggle.addEventListener('click', function() {
      const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!isExpanded));
      menuToggle.setAttribute('aria-label', isExpanded ? 'メニューを開く' : 'メニューを閉じる');
      globalNav.hidden = isExpanded;
    });
    document.addEventListener('click', function(event) {
      if (!globalNav.hidden && !event.target.closest('.header-inner')) {
        globalNav.hidden = true;
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'メニューを開く');
      }
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        globalNav.hidden = true;
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'メニューを開く');
      }
    });
  </script>
</body>
</html>
